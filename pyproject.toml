[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pl-hems-mpc"
version = "0.1.0"
description = "15-minute Model Predictive Control (MILP) for a Polish prosumer home (PV, LFP battery, heat pump, EV) and a small C&I site (B23 + PSE capacity fee K-factor + peak shaving), tested in closed loop over a Modbus TCP / SunSpec register server with a Home Assistant MQTT bridge."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Konrad Waleszczyński" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hems-mpc = "hems_mpc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
