[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pl-hems-mpc"
version = "0.1.0"
description = "Daily 15-minute MILP dispatch for a Polish prosumer home (PV, LFP battery, heat pump, EV) under RCE net-billing and for a small C&I site on B23 with the capacity-fee K-groups, replayed over a localhost Modbus TCP emulator and exported as Home Assistant MQTT discovery payloads."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Konrad Waleszczyński" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hems-mpc = "hems_mpc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
